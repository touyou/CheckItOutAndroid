name: Android build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build
        run: ./gradlew assembleDebug assembleRelease lintDebug
      # Play は targetSdk 35 以上のアプリに 16 KB ページサイズ対応を求める。ネイティブライブラリの LOAD セグメントが 16 KB 境界に揃っているかを見る
      - name: Check 16 KB page alignment
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk" | tail -n 3
          mkdir -p so && unzip -o -q "$apk" 'lib/*' -d so
          status=0
          for so in $(find so -name '*.so'); do
            align=$(readelf -lW "$so" | awk '/LOAD/ {print $NF; exit}')
            echo "$so $align"
            if [ $((align)) -lt 16384 ]; then status=1; fi
          done
          exit $status
